<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=yes"
    />
    <title>神秘电子音乐体系</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤔</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="topbar">
      <input
        type="text"
        id="search"
        placeholder="搜索曲风..."
        oninput="doSearch(this.value)"
        autocomplete="off"
      />
      <span class="ch-count" id="ch-count"></span>
      <button id="group-btn" onclick="openGroup()">讨论区</button>
      <button id="about-btn" onclick="openAbout()">关于本站</button>
      <div id="search-results" style="display: none"></div>
    </div>
    <button class="scroll-btn left" onclick="scrollCols(-400)" title="向左滚动">
      ←
    </button>
    <button class="scroll-btn right" onclick="scrollCols(400)" title="向右滚动">
      →
    </button>
    <div
      id="swipe-hint"
      style="
        display: none;
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        background: #1e293bee;
        backdrop-filter: blur(8px);
        color: #94a3b8;
        font-size: 11px;
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid #334155;
        pointer-events: none;
        transition: opacity 0.5s;
      "
    >
      左右滑动浏览篇章
    </div>
    <div id="wrapper">
      <div id="dim"></div>
      <div id="container"></div>
      <div id="detail">
        <button class="close-btn" onclick="closeDetail()">×</button>
        <div id="detail-inner"></div>
      </div>
    </div>

    <div id="about-mask" onclick="closeAbout()"></div>
    <div id="about-dialog" role="dialog" aria-modal="true" aria-label="关于本站">
      <button class="about-close" onclick="closeAbout()">×</button>
      <div class="about-title">关于本站</div>
      <div class="about-icon">🤔</div>
      <div class="about-icon-note">（不知道用什么图标）</div>
      <div class="about-credit">
        <div>· 资料来源于
          <a
            href="https://www.bilibili.com/video/BV1tusFePEUM/?share_source=copy_web&vd_source=4a668a5ff37aa77ec566058febd2633a"
            target="_blank"
            rel="noopener"
            >【全网最全！1000+个电音风格/标签科普介绍视频丨共计6个小时的电音宇宙漫游指南第四期！】</a
          ></div
        >
        <div class="credit-line">· 如有错误可前往
          <a
            href="https://github.com/YeisuQwQ/music_genre/issues"
            target="_blank"
            rel="noopener"
            >Github提交issues</a
          >
          或QQ：3069309919</div
        >
      </div>
    </div>

    <div id="group-mask" onclick="closeGroup()"></div>
    <div id="group-dialog" role="dialog" aria-modal="true" aria-label="讨论区">
      <button class="group-close" onclick="closeGroup()">×</button>
      <div class="group-head">
        <div class="group-title">讨论区</div>
      </div>
      <div class="group-body">
        <div class="group-loading" id="group-loading">
          <div class="group-spinner"></div>
          <span>加载中</span>
        </div>
        <div class="giscus"></div>
      </div>
    </div>

    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
